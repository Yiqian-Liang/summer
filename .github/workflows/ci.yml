name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_LIVE_SEARCH: "1"
      DISABLE_SEMANTIC_SEARCH: "1"
      ENABLE_AI_DRAFTING: "0"
      ENABLE_MATCH_AI: "0"
      ENABLE_DEV_PASSWORD_RESET: "0"
      MEDIACRAWLER_DATA_PATH: ""
      SUMMER_DB_PATH: ${{ runner.temp }}/summer-ci.db
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v

  container:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag summer-research-ci:${{ github.sha }} .

      - name: Start production image
        run: |
          docker run --detach --name summer-research-ci \
            --publish 127.0.0.1:8000:8000 \
            --env PORT=8000 \
            --env SUMMER_DB_PATH=/data/summer-ci.db \
            --env DISABLE_LIVE_SEARCH=1 \
            --env DISABLE_SEMANTIC_SEARCH=1 \
            summer-research-ci:${{ github.sha }}

      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs summer-research-ci
          exit 1

      - name: Stop production image
        if: always()
        run: docker rm --force summer-research-ci || true
